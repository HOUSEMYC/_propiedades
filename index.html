<!DOCTYPE html><!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOUSEMYCPROPIEDADES — Portal Inmobiliario</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <!-- Encabezado -->
  <header class="bg-zinc-950 border-b border-amber-500/30">
    <div class="max-w-6xl mx-auto px-4 py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-amber-400">HOUSEMYCPROPIEDADES</h1>
      </div>
      <span class="text-xs text-amber-300 bg-amber-950/40 border border-amber-500/40 px-3 py-1.5 rounded-full">
        Maqueta inicial · Gestión de imágenes por propiedad
      </span>
    </div>
  </header>

  <!-- Controles de filtro -->
  <section class="max-w-6xl mx-auto px-4 pt-6">
    <div class="bg-gradient-to-b from-amber-950/35 to-zinc-900 rounded-xl shadow-md shadow-amber-950/20 border border-amber-500/50 p-4 grid grid-cols-1 md:grid-cols-4 gap-3">
      <div>
        <label class="block text-xs font-semibold text-amber-300 mb-1">Operación</label>
        <select id="filterOperation" class="w-full rounded-lg border border-amber-500/60 px-3 py-2 text-sm bg-zinc-950 text-amber-100 focus:outline-none focus:border-amber-400">
          <option value="all">Todas (Venta y Arriendo)</option>
          <option value="sale">Venta</option>
          <option value="rent">Arriendo</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-amber-300 mb-1">Tipo de propiedad</label>
        <select id="filterType" class="w-full rounded-lg border border-amber-500/60 px-3 py-2 text-sm bg-zinc-950 text-amber-100 focus:outline-none focus:border-amber-400">
          <option value="all">Todos los tipos</option>
          <option value="house">Casa</option>
          <option value="apartment">Departamento</option>
          <option value="parcel">Terreno / Paño</option>
        </select>
      </div>

      <div class="md:col-span-2">
        <label class="block text-xs font-semibold text-amber-300 mb-1">Buscar por título o sector</label>
        <input
          id="filterSearch"
          type="text"
          placeholder="Ej. Temuco, Rudecindo Ortega, paño, departamento..."
          class="w-full rounded-lg border border-amber-500/60 px-3 py-2 text-sm bg-zinc-950 text-amber-100 placeholder-amber-200/40 focus:outline-none focus:border-amber-400"
        />
      </div>
    </div>
  </section>

  <!-- Catálogo -->
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold text-amber-400">Propiedades disponibles</h2>
      <span id="propertyCount" class="text-sm text-amber-300/80"></span>
    </div>

    <div id="catalogGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- Modal de ficha y gestión de imágenes -->
  <div id="detailModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-zinc-950 rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-amber-500/60">
      <div class="flex items-center justify-between px-6 py-4 border-b border-amber-500/30 sticky top-0 bg-zinc-950 z-10">
        <h3 id="modalTitle" class="text-lg font-bold text-amber-400"></h3>
        <button id="closeModalBtn" class="text-amber-300 hover:text-amber-100 text-xl font-bold px-2">×</button>
      </div>

      <div id="modalBody" class="p-6 space-y-6"></div>
    </div>
  </div>

  <script>
    function createFallbackImage(text) {
      const safeText = String(text || "HOUSEMYCPROPIEDADES").slice(0, 38);
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
          <rect width="800" height="450" fill="#09090b"/>
          <rect x="28" y="28" width="744" height="394" rx="18" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="8 8"/>
          <text x="400" y="195" fill="#fbbf24" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">HOUSEMYCPROPIEDADES</text>
          <text x="400" y="235" fill="#fef3c7" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">${safeText}</text>
          <text x="400" y="272" fill="#d97706" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Sube la foto en frontend/images/ para verla aquí</text>
        </svg>
      `.trim();
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    function handleImageError(imgEl, labelText) {
      if (imgEl.dataset.fallbackApplied === "true") return;
      imgEl.dataset.fallbackApplied = "true";
      imgEl.src = createFallbackImage(labelText);
    }

    let properties = [
      {
        id: 1,
        title: "Departamento Rudecindo Ortega Temuco",
        operation: "sale",
        type: "apartment",
        commune: "Temuco · Rudecindo Ortega",
        price: "$138.000.000 CLP",
        area: "58 m² útiles · Condominio",
        status: "Disponible",
        description: "Departamento en sector Rudecindo Ortega, Temuco, con acceso controlado, estacionamientos y conectividad hacia el centro y sectores norte/poniente.",
        images: [
          {
            id: "img-101",
            url: "./images/departamento-rudecindo-ortega-portada.jpg",
            label: "Acceso y torres del condominio",
            isCover: true
          },
          {
            id: "img-102",
            url: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=900&q=80",
            label: "Vista interior",
            isCover: false
          },
          {
            id: "img-103",
            url: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=900&q=80",
            label: "Sala de estar",
            isCover: false
          }
        ]
      },
      {
        id: 2,
        title: "Departamento Cercano a Av. Alemania",
        operation: "rent",
        type: "apartment",
        commune: "Temuco · Centro / Poniente",
        price: "$520.000 CLP / mes",
        area: "58 m² útiles",
        status: "Disponible",
        description: "Departamento de 2 dormitorios y 2 baños, excelente conectividad y cercanía a comercio y universidades.",
        images: [
          {
            id: "img-201",
            url: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=900&q=80",
            label: "Vista interior",
            isCover: true
          },
          {
            id: "img-202",
            url: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=900&q=80",
            label: "Sala de estar",
            isCover: false
          }
        ]
      },
      {
        id: 3,
        title: "Paño / Terreno Urbano con Potencial Comercial",
        operation: "sale",
        type: "parcel",
        commune: "Temuco · Pueblo Nuevo",
        price: "Consultar valor",
        area: "2.500 m² superficie total",
        status: "Disponible",
        description: "Superficie ideal para desarrollo inmobiliario, bodegaje o proyecto comercial según normativa local.",
        images: [
          {
            id: "img-301",
            url: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=900&q=80",
            label: "Vista general del terreno",
            isCover: true
          },
          {
            id: "img-302",
            url: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80",
            label: "Entorno y accesos",
            isCover: false
          }
        ]
      }
    ];

    let activePropertyId = null;

    const catalogGrid = document.getElementById("catalogGrid");
    const propertyCount = document.getElementById("propertyCount");
    const filterOperation = document.getElementById("filterOperation");
    const filterType = document.getElementById("filterType");
    const filterSearch = document.getElementById("filterSearch");
    const detailModal = document.getElementById("detailModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");
    const closeModalBtn = document.getElementById("closeModalBtn");

    function getCoverImage(property) {
      return property.images.find((img) => img.isCover) || property.images[0];
    }

    function renderCatalog() {
      const op = filterOperation.value;
      const type = filterType.value;
      const query = filterSearch.value.trim().toLowerCase();

      const filtered = properties.filter((p) => {
        const matchOp = op === "all" || p.operation === op;
        const matchType = type === "all" || p.type === type;
        const matchText =
          !query ||
          p.title.toLowerCase().includes(query) ||
          p.commune.toLowerCase().includes(query) ||
          p.description.toLowerCase().includes(query);
        return matchOp && matchType && matchText;
      });

      propertyCount.textContent = `${filtered.length} ${filtered.length === 1 ? "propiedad" : "propiedades"}`;

      if (filtered.length === 0) {
        catalogGrid.innerHTML = `
          <div class="col-span-full bg-amber-950/30 rounded-xl border border-amber-500/50 p-8 text-center text-amber-200">
            No se encontraron propiedades con esos filtros.
          </div>
        `;
        return;
      }

      catalogGrid.innerHTML = filtered
        .map((p) => {
          const cover = getCoverImage(p);
          const badgeText = p.operation === "sale" ? "Venta" : "Arriendo";
          const badgeColor = p.operation === "sale" ? "bg-amber-500 text-zinc-950" : "bg-amber-700 text-amber-50";
          const fallbackLabel = `${p.title} · ${cover.label}`;

          return `
            <article class="bg-gradient-to-b from-amber-950/30 to-zinc-900 rounded-xl shadow-md shadow-amber-950/20 border border-amber-500/55 overflow-hidden flex flex-col">
              <div class="relative h-48 bg-zinc-900 border-b border-amber-500/30">
                <img
                  src="${cover.url}"
                  alt="${p.title}"
                  onerror="handleImageError(this, '${fallbackLabel.replace(/'/g, "\\'")}')"
                  class="w-full h-full object-cover"
                />
                <span class="absolute top-3 left-3 ${badgeColor} text-xs font-bold px-2.5 py-1 rounded-full">
                  ${badgeText}
                </span>
                <span class="absolute bottom-3 right-3 bg-zinc-950/90 border border-amber-500/40 text-amber-300 text-xs px-2.5 py-1 rounded-full">
                  ${p.images.length} ${p.images.length === 1 ? "foto" : "fotos"}
                </span>
              </div>

              <div class="p-4 flex-1 flex flex-col justify-between space-y-4">
                <div>
                  <p class="text-xs text-amber-300/80 font-medium">${p.commune}</p>
                  <h3 class="text-base font-bold text-amber-100 mt-0.5">${p.title}</h3>
                  <p class="text-lg font-extrabold text-amber-400 mt-2">${p.price}</p>
                  <p class="text-xs text-amber-200/75 mt-1">${p.area}</p>
                </div>

                <button
                  onclick="openPropertyModal(${p.id})"
                  class="w-full py-2 px-4 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 text-sm font-bold transition cursor-pointer"
                >
                  Ver ficha y fotos
                </button>
              </div>
            </article>
          `;
        })
        .join("");
    }

    function openPropertyModal(propertyId) {
      activePropertyId = propertyId;
      const property = properties.find((p) => p.id === propertyId);
      if (!property) return;

      modalTitle.textContent = property.title;

      modalBody.innerHTML = `
        <div class="space-y-2">
          <div class="flex flex-wrap gap-2 text-xs">
            <span class="bg-amber-950/60 border border-amber-500/40 text-amber-200 px-2.5 py-1 rounded-full font-medium">${property.commune}</span>
            <span class="bg-amber-950/60 border border-amber-500/40 text-amber-200 px-2.5 py-1 rounded-full font-medium">${property.area}</span>
            <span class="bg-amber-500 text-zinc-950 px-2.5 py-1 rounded-full font-bold">${property.status}</span>
          </div>
          <p class="text-xl font-extrabold text-amber-400">${property.price}</p>
          <p class="text-sm text-amber-100/85 leading-relaxed">${property.description}</p>
        </div>

        <div class="border-t border-amber-500/30 pt-4 space-y-3">
          <div class="flex items-center justify-between">
            <h4 class="text-sm font-bold text-amber-300">Galería de la propiedad (ID: ${property.id})</h4>
            <span class="text-xs text-amber-200/70">Elige cuál foto es portada</span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${property.images
              .map(
                (img) => `
              <div class="border rounded-xl overflow-hidden bg-zinc-900 ${img.isCover ? "border-amber-400 ring-2 ring-amber-400/40" : "border-amber-500/35"}">
                <img
                  src="${img.url}"
                  alt="${img.label}"
                  onerror="handleImageError(this, '${img.label.replace(/'/g, "\\'")}')"
                  class="w-full h-40 object-cover"
                />
                <div class="p-3 flex items-center justify-between gap-2 bg-amber-950/35">
                  <div>
                    <p class="text-xs font-semibold text-amber-100">${img.label}</p>
                    <p class="text-[11px] text-amber-300/75">${img.isCover ? "Portada actual" : "Galería"}</p>
                  </div>
                  ${
                    img.isCover
                      ? `<span class="text-xs font-bold text-zinc-950 bg-amber-400 px-2 py-1 rounded">Portada</span>`
                      : `<button
                          onclick="setCoverImage(${property.id}, '${img.id}')"
                          class="text-xs bg-amber-500 hover:bg-amber-400 text-zinc-950 px-2.5 py-1.5 rounded font-bold cursor-pointer"
                        >
                          Hacer portada
                        </button>`
                  }
                </div>
              </div>
            `
              )
              .join("")}
          </div>
        </div>

        <form onsubmit="addImageToProperty(event, ${property.id})" class="border-t border-amber-500/30 pt-4 space-y-3">
          <h4 class="text-sm font-bold text-amber-300">Agregar foto a esta propiedad (prueba local)</h4>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <input
              id="newImgUrl"
              type="url"
              required
              placeholder="https://...jpg o .webp"
              class="sm:col-span-2 rounded-lg border border-amber-500/60 bg-zinc-900 text-amber-100 placeholder-amber-200/40 px-3 py-2 text-sm"
            />
            <input
              id="newImgLabel"
              type="text"
              placeholder="Etiqueta (ej. Cocina)"
              class="rounded-lg border border-amber-500/60 bg-zinc-900 text-amber-100 placeholder-amber-200/40 px-3 py-2 text-sm"
            />
          </div>
          <button
            type="submit"
            class="bg-amber-500 hover:bg-amber-400 text-zinc-950 text-sm font-bold px-4 py-2 rounded-lg cursor-pointer"
          >
            Añadir a la galería
          </button>
        </form>
      `;

      detailModal.classList.remove("hidden");
      detailModal.classList.add("flex");
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=./frontend/" />
  <title>HOUSEMYCPROPIEDADES</title>
</head>
<body>
  <p>Cargando <a href="./frontend/">HOUSEMYCPROPIEDADES</a>...</p>
</body>
</html>
